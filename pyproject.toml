[project]
name = "template-pipeline"
version = "0.1.0"
description = "Reusable PySpark pipeline template for execution on the data platform."
requires-python = ">=3.10,<3.11"
dependencies = [
    "pyyaml==6.0.2",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "8.3.5"

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["poetry-core==2.4.0"]
build-backend = "poetry.core.masonry.api"
